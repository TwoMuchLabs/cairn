name: variantbench

# Manual only: runs real model calls against VariantBench and costs money.
on:
  workflow_dispatch:
    inputs:
      split:
        description: Which split to run. Use holdout only for release numbers.
        type: choice
        options: [dev, holdout]
        default: dev
      limit:
        description: Maximum number of cases (start small to see cost and quality).
        default: "30"
      max_usd:
        description: Stop starting new cases once estimated model spend reaches this many US dollars.
        default: "5"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish results to the bench-results branch (main stays protected)
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e . "semgrep==1.182.1"
      - name: Run VariantBench
        env:
          CAIRN_MODEL: ${{ vars.CAIRN_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          SPLIT: ${{ inputs.split }}
          LIMIT: ${{ inputs.limit }}
          MAX_USD: ${{ inputs.max_usd }}
        run: |
          if [ -z "$CAIRN_MODEL" ]; then
            echo "::error::Set the repository variable CAIRN_MODEL (e.g. anthropic:claude-sonnet-5-5) and the matching API key secret."
            exit 1
          fi
          python bench/variantbench/run.py --split "$SPLIT" --limit "$LIMIT" --max-usd "$MAX_USD" --out runs
          cat runs/*/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: variantbench-${{ inputs.split }}
          path: runs/
          retention-days: 30
      - name: Publish results to the bench-results branch
        if: always() && hashFiles('runs/*/results/*.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SPLIT: ${{ inputs.split }}
        run: |
          # A run that stopped early still gets a summary of the cases it finished.
          for d in runs/*/; do [ -f "$d/summary.md" ] || python bench/variantbench/run.py --report "$d" > /dev/null; done
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git fetch --depth=1 "$remote" bench-results 2>/dev/null; then
            git worktree add -B bench-results ../results FETCH_HEAD
          else
            git worktree add --orphan -b bench-results ../results
          fi
          mkdir -p ../results/runs
          cp -r runs/* ../results/runs/
          cd ../results
          git add runs
          git commit -q -m "VariantBench run $(ls runs | tail -1) (${SPLIT:-dev})"
          git push -q "$remote" bench-results

